[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m-hunter"
version = "0.1.0"
description = "Modular Web Security Research Platform"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "typer>=0.12",
    "httpx>=0.27"
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
m-hunter = "m_hunter.main:main"
m-hunter-gui = "m_hunter.gui.app:main"

[tool.setuptools.packages.find]
include = ["m_hunter*"]
